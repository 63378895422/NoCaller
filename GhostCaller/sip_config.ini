# SIP Configuration for GhostCaller/NoCaller
# Configure your PBX and SIP server settings here

[SIP_SERVER]
# SIP server settings
host = sip.example.com
port = 5060
transport = UDP
use_tls = False
tls_port = 5061

[AUTHENTICATION]
# SIP authentication credentials
username = your_username
password = your_password
domain = example.com
realm = example.com

[CALLING_SETTINGS]
# Default calling parameters
default_caller_id = GhostCaller
max_call_duration = 300
enable_caller_id_spoofing = True

[SMS_SETTINGS]
# SMS delivery via SIP
use_sip_message = True
use_call_with_sms = True
message_format = plain
max_message_length = 160

[PBX_SETTINGS]
# PBX-specific settings
pbx_type = asterisk
extension_pattern = *2000
outbound_proxy = 
register_expires = 3600

[ADVANCED]
# Advanced SIP features
enable_nat_traversal = True
stun_server = stun.l.google.com:19302
enable_early_media = True
dtmf_method = rfc2833